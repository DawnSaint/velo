name: Build

# 触发方式：
#   1. push tag v* —— release-please 创建 tag 后自动触发，
#      同时构建 Windows + macOS ARM64 并上传到该 Release
#   2. workflow_dispatch —— 手动构建指定平台，仅上传 artifact，不创建 Release
#      勾选 run-e2e 时改为在 Windows 上跑 E2E（不构建 installer）
#
# 设计取舍：
#   - Release 只由 release-please 的 tag push 路径创建，手动构建只产出 artifact，
#     避免 tauri-action 在 tagName 不存在时自动创建新 Release 条目。
#   - tag push 的两个平台用 matrix 合并（共享 setup 链），仅 verify 步骤按 matrix.os 条件分支。
#   - E2E job 与 build-release 并行（不 needs），自行构建 release 裸 binary（--no-bundle）。
#     Phase 1: continue-on-error，失败不阻塞 release attach。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'platform (ignored if run-e2e is true)'
        required: false
        type: choice
        default: windows-x64
        options:
          - linux-x64
          - linux-x64-portable
          - macos-arm64
          - macos-x64
          - windows-x64
      run-e2e:
        description: 'run E2E (Windows only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── tag push (v*): 构建并上传到 release-please 的 Release ──
  build-release:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: Velo-windows-x64
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            artifact-name: Velo-macos-arm64
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # tag push: release-please 已创建 Release（含 changelog body），
      # tauri-action 只需找到该 Release 并上传产物，不传 releaseBody 以保留原始内容。
      # updater: TAURI_SIGNING_PRIVATE_KEY 环境变量触发 Tauri CLI 签名更新包；
      # includeUpdaterJson: tauri-action 收集签名后的更新包信息，生成 latest.json 上传到 Release。
      # updaterJsonPreferNsis: Windows 用 NSIS 格式（Velo 不再打 MSI）。
      - name: Build and publish to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Velo ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify exe (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $exe = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          Write-Host "=== exe: $($exe.Name) ==="
          Get-AuthenticodeSignature $exe.FullName | Format-List Status, SignerCertificate
          $exe.VersionInfo | Format-List ProductName, ProductVersion, FileVersion
          Write-Host "exe 校验通过"

      - name: Verify dmg (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "=== dmg: $dmg ==="
          hdiutil verify "$dmg"
          echo "dmg 校验通过"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: ignore
          retention-days: 7

  # ── workflow_dispatch: 手动构建指定平台 ──
  # 不创建 Release，仅构建 + 上传 artifact，避免 tauri-action 自动创建新 Release 条目。
  # 因此改用 `tauri build` 直接构建，而不是 tauri-action。
  build-platform:
    if: github.event_name == 'workflow_dispatch' && !inputs.run-e2e
    runs-on: ${{ (inputs.platform == 'linux-x64' || inputs.platform == 'linux-x64-portable') && 'ubuntu-22.04' || inputs.platform == 'macos-arm64' && 'macos-latest' || inputs.platform == 'macos-x64' && 'macos-15-intel' || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        if: inputs.platform != 'linux-x64-portable'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: inputs.platform != 'linux-x64-portable'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: inputs.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # ── 自包含 AppImage（linux-x64-portable）在下方「Build portable AppImage」步骤里
      #    用 archlinux 容器 + pkgforge sharun 构建，本机不需要装 webkit，也不需要
      #    自托管任何运行时 tarball。 ──

      - name: Install frontend dependencies
        if: inputs.platform != 'linux-x64-portable'
        run: npm ci

      # 手动构建：直接用 tauri build，不经过 tauri-action，因此不会创建 Release。
      # 同样注入签名密钥，以便测试更新包签名是否正常。
      - name: Build with Tauri
        if: inputs.platform != 'linux-x64-portable'
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 自包含 AppImage（UOS V20 / 老 glibc / 缺 libwebkit2gtk-4.1 的系统）：
      # 在 archlinux 容器里用 pkgforge sharun + uruntime 打包。
      # - sharun 自动探测并打包 webkit2gtk-4.1 + glibc + opengl 等全部依赖
      # - uruntime 让终端用户侧无需 libfuse2 / 无需开发者模式（FUSE→namespace→extract 回退）
      # - 注意 UOS 4.19 内核 + Arch mesa 25 不兼容：脚本内 get-debloated-pkgs.sh 精简 mesa（非致命）
      - name: Build portable AppImage (Arch + sharun)
        if: inputs.platform == 'linux-x64-portable'
        run: |
          set -e
          docker run --rm -v "$PWD":/ws -w /ws archlinux:latest bash -c '
            set -e
            pacman -Syu --noconfirm
            # 用 rust 包直接提供 cargo/rustc(/usr/bin),不要 rustup —— Arch 上
            # rustup 的 $HOME/.cargo/env 不一定生成,source 会失败。
            # xdotool 提供 libxdo.so(tauri 的 muda/global-shortcut 链接所需);
            # Arch 包名是 xdotool,不是 Debian 的 libxdo。
            pacman -S --noconfirm --needed base-devel git nodejs npm rust \
              webkit2gtk-4.1 libayatana-appindicator xdotool librsvg openssl patchelf wget curl
            npm ci
            npm run tauri:build:appimage
          '

      - name: Verify deb (Linux)
        if: inputs.platform == 'linux-x64'
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          echo "=== deb: $deb ==="
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | head -20
          echo "deb 校验通过"

      - name: Verify AppImage (portable)
        if: inputs.platform == 'linux-x64-portable'
        run: |
          ai=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          echo "=== AppImage: $ai ==="
          file "$ai"
          ls -la "$ai"
          echo "AppImage 校验通过"

      - name: Verify dmg (macOS)
        if: startsWith(inputs.platform, 'macos-')
        run: |
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "=== dmg: $dmg ==="
          hdiutil verify "$dmg"
          echo "dmg 校验通过"

      - name: Verify exe (Windows)
        if: inputs.platform == 'windows-x64'
        shell: powershell
        run: |
          $exe = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          Write-Host "=== exe: $($exe.Name) ==="
          Get-AuthenticodeSignature $exe.FullName | Format-List Status, SignerCertificate
          $exe.VersionInfo | Format-List ProductName, ProductVersion, FileVersion
          Write-Host "exe 校验通过"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Velo-${{ inputs.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
          retention-days: 7

  # ── E2E: tag push 或 workflow_dispatch(run-e2e=true) 时在 Windows 上跑 ──
  # 消费 release 裸 binary（tauri build --no-bundle），不依赖 build-release 产物。
  # Phase 1: continue-on-error，E2E 失败不阻塞 release attach；稳定后改为硬门。
  # 工具链：tauri-driver（cargo install）+ msedgedriver（匹配 runner 自带 Edge 版本）。
  e2e:
    if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.run-e2e)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # 构建 release 裸 binary（不打包 installer），产出 src-tauri/target/release/velo.exe
      - name: Build release binary (no-bundle)
        run: npx tauri build --no-bundle

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # GitHub Actions windows-latest 自带 Edge，下载匹配版本的 msedgedriver。
      # 微软已废弃 azureedge.net CDN 域名（DNS NXDOMAIN），新地址为 msedgedriver.microsoft.com。
      - name: Install msedgedriver
        shell: powershell
        run: |
          $edgeVersion = (Get-Item "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          $url = "https://msedgedriver.microsoft.com/${edgeVersion}/edgedriver_win64.zip"
          Invoke-WebRequest -Uri $url -OutFile edgewebdriver.zip
          Expand-Archive -Path edgewebdriver.zip -DestinationPath C:\edgedriver -Force
          echo "C:\edgedriver" >> $env:GITHUB_PATH

      - name: Run E2E
        run: npm run test:e2e
        env:
          VELO_E2E_BINARY: ${{ github.workspace }}\src-tauri\target\release\velo.exe
