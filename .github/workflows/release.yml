name: Release

# 触发方式：
#   1. push tag v* —— 正式发版，构建并上传到 GitHub Release（与 release-please 衔接）
#   2. workflow_dispatch —— 手动触发，只构建，产物作为 artifact 下载验证（不打 tag、不创建 Release）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact_id: linux-x64
          - platform: macos-latest
            artifact_id: macos-arm64
          - platform: macos-13
            artifact_id: macos-x64
          - platform: windows-latest
            artifact_id: windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # ── tag push: 正式发版，构建并上传到 GitHub Release ──
      # 先从 CHANGELOG.md 提取当前版本片段，传给 tauri-action 的 releaseBody
      # 防御 release-please 未创建 release / 手动打 tag 发版的场景
      - name: Extract changelog for this release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node << 'SCRIPT' >> "$GITHUB_ENV"
          const fs = require("fs");
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const escaped = version.replace(/[.\\]/g, "\\$&");
          const regex = new RegExp(`(## \\[${escaped}\\][^\\n]*\\n)([\\s\\S]*?)(?=\\n## \\[|\\n# |$)`);
          const match = changelog.match(regex);
          const body = match ? match[1] + match[2].trimEnd() : `Release ${version}`;
          process.stdout.write(`RELEASE_BODY<<EOF\n${body}\nEOF\n`);
          SCRIPT

      - name: Build and publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Velo v__VERSION__'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false

      # ── workflow_dispatch: 手动测试，只构建不上传 Release ──
      - name: Build (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri:build

      # ── 产物完整性校验（不启动 GUI，只验证包结构 / 签名 / 元数据）──
      # 真正的「能否启动」验证属于 ROADMAP #ci-pipeline 第 5 步 E2E 验收，此处先做轻量门
      - name: Verify deb (Linux)
        if: github.event_name == 'workflow_dispatch' && matrix.artifact_id == 'linux-x64'
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          echo "=== deb: $deb ==="
          dpkg-deb -I "$deb"        # 元信息（依赖 / 版本 / 架构）
          dpkg-deb -c "$deb" | head -20  # 内容文件列表前 20 行
          echo "deb 校验通过"

      - name: Verify dmg (macOS)
        if: github.event_name == 'workflow_dispatch' && startsWith(matrix.artifact_id, 'macos-')
        run: |
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "=== dmg: $dmg ==="
          hdiutil verify "$dmg"     # 校验镜像完整性 / 签名
          echo "dmg 校验通过"

      - name: Verify exe (Windows)
        if: github.event_name == 'workflow_dispatch' && matrix.artifact_id == 'windows-x64'
        shell: powershell
        run: |
          $exe = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          Write-Host "=== exe: $($exe.Name) ==="
          Get-AuthenticodeSignature $exe.FullName | Format-List Status, SignerCertificate
          $exe.VersionInfo | Format-List ProductName, ProductVersion, FileVersion
          Write-Host "exe 校验通过"

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Velo-${{ matrix.artifact_id }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
          retention-days: 7
