name: Release

# 触发方式：
#   1. push tag v* —— release-please 创建 tag 后自动触发，仅构建 Windows 并上传到该 Release
#   2. workflow_dispatch —— 手动构建指定平台，创建 per-platform Release（如 v0.7.5-linux-x64）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        type: string
      platform:
        description: '目标平台'
        required: true
        type: choice
        options:
          - linux-x64
          - macos-arm64
          - macos-x64
          - windows-x64

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact_id: linux-x64
            platform_name: Linux x64
          - platform: macos-latest
            artifact_id: macos-arm64
            platform_name: macOS ARM64
          - platform: macos-15-intel
            artifact_id: macos-x64
            platform_name: macOS x64
          - platform: windows-latest
            artifact_id: windows-x64
            platform_name: Windows x64

    runs-on: ${{ matrix.platform }}

    # tag push (v*): 仅构建 Windows（默认平台）
    # workflow_dispatch: 仅构建手动选定的平台
    if: |
      (github.event_name == 'push' && matrix.artifact_id == 'windows-x64') ||
      (github.event_name == 'workflow_dispatch' && matrix.artifact_id == inputs.platform)

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # ── 计算 release tag 和版本号 ──
      # tag push: 使用 github.ref_name（如 v0.7.5）—— release-please 已创建该 Release
      # workflow_dispatch: 使用 v{version}-{platform}（如 v0.7.5-linux-x64）—— 创建新的 per-platform Release
      - name: Compute release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
            echo "RELEASE_NAME=Velo v$VERSION" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=v${{ inputs.version }}-${{ matrix.artifact_id }}" >> $GITHUB_ENV
            echo "RELEASE_VERSION=${{ inputs.version }}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Velo v${{ inputs.version }} (${{ matrix.platform_name }})" >> $GITHUB_ENV
          fi

      # ── 从 CHANGELOG.md 提取当前版本片段，传给 tauri-action 的 releaseBody ──
      # 防御 release-please 未创建 release / 手动打 tag 发版的场景
      - name: Extract changelog for this release
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          node << 'SCRIPT' >> "$GITHUB_ENV"
          const fs = require("fs");
          const version = process.env.VERSION;
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const escaped = version.replace(/[.\\]/g, "\\$&");
          const regex = new RegExp(`(## \\[${escaped}\\][^\\n]*\\n)([\\s\\S]*?)(?=\\n## \\[|\\n# |$)`);
          const match = changelog.match(regex);
          const body = match ? match[1] + match[2].trimEnd() : `Release ${version}`;
          process.stdout.write(`RELEASE_BODY<<EOF\n${body}\nEOF\n`);
          SCRIPT

      - name: Build and publish to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false

      # ── 产物完整性校验（仅 workflow_dispatch 手动触发时）──
      # 真正的「能否启动」验证属于 ROADMAP #ci-pipeline 第 5 步 E2E 验收，此处先做轻量门
      - name: Verify deb (Linux)
        if: github.event_name == 'workflow_dispatch' && matrix.artifact_id == 'linux-x64'
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          echo "=== deb: $deb ==="
          dpkg-deb -I "$deb"        # 元信息（依赖 / 版本 / 架构）
          dpkg-deb -c "$deb" | head -20  # 内容文件列表前 20 行
          echo "deb 校验通过"

      - name: Verify dmg (macOS)
        if: github.event_name == 'workflow_dispatch' && startsWith(matrix.artifact_id, 'macos-')
        run: |
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "=== dmg: $dmg ==="
          hdiutil verify "$dmg"     # 校验镜像完整性 / 签名
          echo "dmg 校验通过"

      - name: Verify exe (Windows)
        if: github.event_name == 'workflow_dispatch' && matrix.artifact_id == 'windows-x64'
        shell: powershell
        run: |
          $exe = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          Write-Host "=== exe: $($exe.Name) ==="
          Get-AuthenticodeSignature $exe.FullName | Format-List Status, SignerCertificate
          $exe.VersionInfo | Format-List ProductName, ProductVersion, FileVersion
          Write-Host "exe 校验通过"

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Velo-${{ matrix.artifact_id }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
          retention-days: 7
