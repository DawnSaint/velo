name: Build

# 触发方式：
#   1. push tag v* —— release-please 创建 tag 后自动触发，
#      同时构建 Windows + macOS ARM64 并上传到该 Release
#   2. workflow_dispatch —— 手动构建指定平台，仅上传 artifact，不创建 Release
#
# 设计取舍：
#   - Release 只由 release-please 的 tag push 路径创建，手动构建只产出 artifact，
#     避免 tauri-action 在 tagName 不存在时自动创建新 Release 条目。
#   - matrix 上下文在 job 级别 if 中不可用（仅 step 级别可用），
#     所以拆成多个独立 job 而非用 matrix + if 过滤。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: '目标平台（仅构建并上传 artifact，不创建 Release）'
        required: true
        type: choice
        options:
          - linux-x64
          - macos-arm64
          - macos-x64
          - windows-x64

permissions:
  contents: write

# ── 共享步骤：计算 release 信息（从 CHANGELOG.md 提取当前版本片段）──
# 两个 release job 逻辑相同，只是 runner 不同，所以内联而非 anchor（YAML anchor 可读性差）

jobs:
  # ── tag push (v*): 构建 Windows 并上传到 release-please 的 Release ──
  release-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # tag push: 使用 github.ref_name（如 v0.7.5）—— release-please 已创建该 Release
      - name: Compute release info
        shell: bash
        run: |
          echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_NAME=Velo v$VERSION" >> $GITHUB_ENV

      # 从 CHANGELOG.md 提取当前版本片段，传给 tauri-action 的 releaseBody
      - name: Extract changelog for this release
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          node << 'SCRIPT' >> "$GITHUB_ENV"
          const fs = require("fs");
          const version = process.env.VERSION;
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const escaped = version.replace(/[.\\]/g, "\\$&");
          const regex = new RegExp(`(## \\[${escaped}\\][^\\n]*\\n)([\\s\\S]*?)(?=\\n## \\[|\\n# |$)`);
          const match = changelog.match(regex);
          const body = match ? match[1] + match[2].trimEnd() : `Release ${version}`;
          process.stdout.write(`RELEASE_BODY<<EOF\n${body}\nEOF\n`);
          SCRIPT

      - name: Build and publish to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false

      - name: Verify exe (Windows)
        shell: powershell
        run: |
          $exe = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          Write-Host "=== exe: $($exe.Name) ==="
          Get-AuthenticodeSignature $exe.FullName | Format-List Status, SignerCertificate
          $exe.VersionInfo | Format-List ProductName, ProductVersion, FileVersion
          Write-Host "exe 校验通过"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Velo-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
          retention-days: 7

  # ── tag push (v*): 构建 macOS ARM64 并上传到 release-please 的 Release ──
  release-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Compute release info
        shell: bash
        run: |
          echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_NAME=Velo v$VERSION" >> $GITHUB_ENV

      - name: Extract changelog for this release
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          node << 'SCRIPT' >> "$GITHUB_ENV"
          const fs = require("fs");
          const version = process.env.VERSION;
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const escaped = version.replace(/[.\]/g, "\$&");
          const regex = new RegExp(`(## \[${escaped}\][^\n]*\n)([\s\S]*?)(?=\n## \[|\n# |$)`);
          const match = changelog.match(regex);
          const body = match ? match[1] + match[2].trimEnd() : `Release ${version}`;
          process.stdout.write(`RELEASE_BODY<<EOF\n${body}\nEOF\n`);
          SCRIPT

      - name: Build and publish to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false

      - name: Verify dmg (macOS)
        run: |
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "=== dmg: $dmg ==="
          hdiutil verify "$dmg"
          echo "dmg 校验通过"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Velo-macos-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
          retention-days: 7

  # ── workflow_dispatch: 手动构建指定平台 ──
  # 不创建 Release，仅构建 + 上传 artifact，避免 tauri-action 自动创建新 Release 条目。
  # 因此改用 `tauri build` 直接构建，而不是 tauri-action。
  build-platform:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.platform == 'linux-x64' && 'ubuntu-22.04' || inputs.platform == 'macos-arm64' && 'macos-latest' || inputs.platform == 'macos-x64' && 'macos-15-intel' || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: inputs.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # 手动构建：直接用 tauri build，不经过 tauri-action，因此不会创建 Release
      - name: Build with Tauri
        run: npm run tauri:build

      - name: Verify deb (Linux)
        if: inputs.platform == 'linux-x64'
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          echo "=== deb: $deb ==="
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | head -20
          echo "deb 校验通过"

      - name: Verify dmg (macOS)
        if: startsWith(inputs.platform, 'macos-')
        run: |
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "=== dmg: $dmg ==="
          hdiutil verify "$dmg"
          echo "dmg 校验通过"

      - name: Verify exe (Windows)
        if: inputs.platform == 'windows-x64'
        shell: powershell
        run: |
          $exe = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          Write-Host "=== exe: $($exe.Name) ==="
          Get-AuthenticodeSignature $exe.FullName | Format-List Status, SignerCertificate
          $exe.VersionInfo | Format-List ProductName, ProductVersion, FileVersion
          Write-Host "exe 校验通过"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Velo-${{ inputs.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
          retention-days: 7
