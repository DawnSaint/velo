name: Test Signing

# 手动触发，验证签名密钥配置是否正确（不构建完整应用，只签名一个测试文件）
on:
  workflow_dispatch:

jobs:
  test-signing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Diagnose signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "=== Signing key diagnosis ==="
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY is EMPTY"
          else
            KEY_LEN=${#TAURI_SIGNING_PRIVATE_KEY}
            echo "✅ TAURI_SIGNING_PRIVATE_KEY is set (length: $KEY_LEN)"
            if echo "$TAURI_SIGNING_PRIVATE_KEY" | head -1 | grep -q "untrusted comment"; then
              echo "ℹ️  Key is in raw minisign format (has 'untrusted comment' header)"
            else
              echo "ℹ️  Key appears to be base64-encoded (Tauri CLI will decode it)"
            fi
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "ℹ️  TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty"
          else
            echo "✅ TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set (length: ${#TAURI_SIGNING_PRIVATE_KEY_PASSWORD})"
          fi

      - name: Sign a test file
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "test content for signing" > test-file.txt
          echo "=== Signing test file ==="
          npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" test-file.txt
          echo "=== Checking signature ==="
          if [ -f test-file.txt.sig ]; then
            echo "✅ Signature file created successfully — signing works!"
            cat test-file.txt.sig
          else
            echo "❌ No signature file created — signing FAILED"
            exit 1
          fi
