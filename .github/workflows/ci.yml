name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Dependency check
        run: npm run lint:deps

      - name: Console lint
        run: npm run lint:console

      - name: Design tokens lint
        run: npm run lint:design-tokens

      - name: Dead code check
        run: npm run knip

      - name: ESLint check
        run: npx eslint . --max-warnings 178

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
