name: CI

# 独立开发 + AI 驱动，不需要每次 push 都跑 CI。
# 触发方式：
#   1. workflow_dispatch —— 发版前手动跑一次全量检查
#   2. push tag v* —— release-please 创建 tag 时自动跑，发版兜底
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Dependency check
        run: npm run lint:deps

      - name: Console lint
        run: npm run lint:console

      - name: Design tokens lint
        run: npm run lint:design-tokens

      - name: Dead code check
        run: npm run knip

      - name: ESLint check
        run: npx eslint . --quiet

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
