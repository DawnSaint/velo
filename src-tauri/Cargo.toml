[package]
name = "velo"
version = "0.6.1"
description = "Velo Markdown Editor"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools", "webview-data-url"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
# v0.5.1: 文件树右键"在资源管理器中显示"用 reveal_item_in_dir。
# plugin-shell.open 只能"用默认应用打开",不能在文件管理器高亮;plugin-opener 专门补这条。
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
base64 = "0.22"

# Windows PDF 导出:WebView2 ICoreWebView2_7::PrintToPdf
# Windows 注册表(v0.5.1 注册"在 Velo 中打开"文件夹右键菜单):winreg
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation"] }
winreg = "0.52"
