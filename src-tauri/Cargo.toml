[package]
name = "velo"
version = "0.7.16"
description = "Velo Markdown Editor"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# 外部 URL 打开(openUrl)与文件树右键"在资源管理器中显示"(reveal_item_in_dir)统一走 plugin-opener。
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.11"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
# serde_json:tauri::generate_context!() 宏展开需要 serde_json 在 crate root 可用,
# 即便代码无直接 serde_json:: 调用也必须保留。
serde_json = "1"
log = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
# #rust-search-quickopen-git Phase 1:工作区遍历单 command 化(Ctrl+P 索引)。
# Phase 2 的全文搜索复用同一 walker。
walkdir = "2"
# Phase 2:全文搜索/替换下沉(ripgrep 同款引擎 + rayon 按文件并行)。
# regex 用于替换路径的 $1/$& 展开(Captures::expand);grep-regex 用于搜索。
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
regex = "1"
rayon = "1"
# Phase 3:Git 历史库化(libgit2 静态链入,免用户装 git)。
# default-features=false 关掉 https/ssh(只读本地仓库,不需要网络传输),
# 避免 OpenSSL 依赖。Windows 链接需 advapi32/crypt32(见 build.rs)。
git2 = { version = "0.19", default-features = false }
# #pdf-font-fidelity: 系统字体枚举 + 度量提取 + PDF 子集化（纯 Rust 跨平台，
# 避免把 18–70MB 完整系统字体跨 IPC 传给前端 WASM）。
fontdb = "0.24"
ttf-parser = "0.25"
subsetter = "0.2"

[dev-dependencies]
tempfile = "3"

# Windows PDF 导出:WebView2 ICoreWebView2_7::PrintToPdf
# (windows crate 的 Foundation/Com 等 feature 经 webview2-com-sys 传递启用,显式声明更稳)
# Windows 注册表(v0.5.1 注册"在 Velo 中打开"文件夹右键菜单):winreg
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.52"

# Release 体积优化(Tauri 官方推荐组合):
# LTO + 单 CGU + opt-level="s" 跨 crate 裁剪 libgit2/reqwest/tauri 死码,
# panic="abort" 去掉 .pdata 栈展开表(src-tauri 无 catch_unwind),strip 剥离符号。
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
